# ============================================================
# 深圳政策匹配系统 Nginx 反向代理示例（Ubuntu + Nginx）
# 放到 /etc/nginx/sites-available/policy-hub 并软链到 sites-enabled
# 把 your-domain.com 换成你的域名；先用 80 跑通，再用 certbot 加 HTTPS
# ============================================================
server {
    listen 80;
    server_name your-domain.com;   # 没有域名时先填服务器公网IP

    # 上传/请求体上限（本系统都是小JSON，给1m足够）
    client_max_body_size 2m;

    # API 与静态页全部反代给本机 uvicorn（8000 不对公网开放）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源可让 Nginx 直接发（可选，去掉也能跑，FastAPI 已挂载 static）
    location /static/ {
        alias /opt/policy-hub/server/static/;
        expires 1h;
        add_header Cache-Control "public";
    }
}

# ------------------------------------------------------------
